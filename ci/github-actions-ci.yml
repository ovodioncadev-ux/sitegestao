# ═══════════════════════════════════════════════════════════════════════════
# CI — Ovo di Onça
#
# Para ATIVAR: copie este arquivo para .github/workflows/ci.yml.
# (Ele fica em ci/ porque o token usado para enviar este código não tem a
#  permissão `workflow` do GitHub, que é exigida para criar arquivos em
#  .github/workflows. Se você tiver essa permissão, basta mover o arquivo.)
#
# Quatro jobs, independentes:
#   seguranca  segredos no código/histórico e dependências vulneráveis
#   qualidade  tipos, lint, testes unitários e build dos 3 apps
#   banco      migrations (subir → descer → subir) + todos os testes SQL + concorrência
#   e2e        apps de verdade + teste de fumaça + CSP imposta + fluxos de assinatura e pagamento
#
# Nada aqui usa o banco de produção nem o Neon: o banco é um Postgres 16 descartável
# criado pelo próprio job. Os únicos "segredos" são valores de teste escritos aqui.
# ═══════════════════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  seguranca:
    name: Segredos e dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico inteiro: a varredura procura .env em commits antigos.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Varredura de segredos
        run: bash scripts/verificar-segredos.sh

      - name: Auditoria de dependências (alta e crítica)
        run: pnpm audit --audit-level=high

      - name: Dependência instalada e não importada (informativo)
        continue-on-error: true
        run: pnpm dlx depcheck --ignores="@types/*,typescript,eslint*,tailwindcss,@tailwindcss/postcss"

  # ─────────────────────────────────────────────────────────────────────────
  qualidade:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # O build inicializa o Better Auth e exige estas variáveis, mas NÃO abre conexão:
      # valores de mentira bastam (e o item 8 de verificar-segredos.sh garante que não vazam).
      DATABASE_URL: postgresql://build:build@localhost:5999/build
      DATABASE_ADMIN_URL: postgresql://build:build@localhost:5999/build
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: segredo-so-para-compilar-0123456789abcdef
      NEXT_PUBLIC_URL_ASSINANTE: http://localhost:3001
      NEXT_PUBLIC_URL_SITE: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  # ─────────────────────────────────────────────────────────────────────────
  banco:
    name: Banco (migrations e testes SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ovo_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Só DATABASE_TEST_URL: os scripts recusam rodar se ela coincidir com DATABASE_URL/ADMIN.
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/ovo_teste
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrations (subir)
        run: pnpm db:migrar:teste
      - name: Migration mais recente (descer e subir de novo)
        # Prova que o "down" funciona: sem ele não há como desfazer um deploy ruim.
        run: |
          pnpm db:migrar:teste down
          pnpm db:migrar:teste

      - name: Testes SQL de todas as fases (inclui concorrência do limite de login)
        run: pnpm teste:banco
      - name: Estrutura (Lei 1) e autorização
        run: pnpm seguranca:estrutura && pnpm seguranca:autorizacao

  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: Apps no ar (fumaça, CSP e fluxos)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ovo_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_TEST_URL: postgresql://postgres:postgres@localhost:5432/ovo_teste
      APP_SERVIDOR_SENHA: senha-do-app-servidor-so-para-ci-123456
      BETTER_AUTH_SECRET: segredo-do-ci-com-mais-de-trinta-e-dois-caracteres
      CRON_SECRET: segredo-de-cron-so-para-o-ci-0123456789
      PAGAMENTO_SIMULADO_SEGREDO: segredo-simulado-so-para-o-ci-0123456789
      NEXT_PUBLIC_URL_ASSINANTE: http://localhost:3001
      NEXT_PUBLIC_URL_SITE: http://localhost:3002
      URL_PUBLICA_ASSINANTE: http://localhost:3001
      # A política de segurança é IMPOSTA no build: é o que vai para produção.
      CSP_MODO: impor
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Cliente do Postgres e navegador
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
          echo "E2E_PLAYWRIGHT=$(npm root -g)/playwright" >> "$GITHUB_ENV"

      - name: Banco de teste (migrations e papel do servidor)
        run: |
          pnpm db:migrar:teste
          DATABASE_ADMIN_URL="$DATABASE_TEST_URL" node packages/database/scripts/criar-papel-servidor.mjs
          # Uma faixa de CEP cobrindo o CEP dos testes (sem faixa ninguém consegue assinar).
          psql "$DATABASE_TEST_URL" -c "insert into faixas_cep_atendidas (cep_inicio, cep_fim, bairro) values ('30110000','30190999','CI')"

      - name: Build dos três apps (CSP imposta)
        env:
          DATABASE_URL: postgresql://app_servidor:senha-do-app-servidor-so-para-ci-123456@localhost:5432/ovo_teste
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/ovo_teste
          BETTER_AUTH_URL: http://localhost:3001
        run: pnpm build

      - name: Subir os três apps
        env:
          DATABASE_URL: postgresql://app_servidor:senha-do-app-servidor-so-para-ci-123456@localhost:5432/ovo_teste
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/ovo_teste
          BETTER_AUTH_URL: http://localhost:3001
        run: |
          (cd apps/assinante && nohup pnpm start > "$RUNNER_TEMP/assinante.log" 2>&1 &)
          (cd apps/gestao    && nohup pnpm start > "$RUNNER_TEMP/gestao.log" 2>&1 &)
          (cd apps/site      && nohup pnpm start > "$RUNNER_TEMP/site.log" 2>&1 &)
          for url in http://localhost:3001/api/saude http://localhost:3000/api/saude http://localhost:3002/api/saude; do
            for i in $(seq 1 40); do
              curl -fsS "$url" > /dev/null 2>&1 && break
              [ "$i" = 40 ] && { echo "✘ $url não subiu"; tail -n 30 "$RUNNER_TEMP"/*.log; exit 1; }
              sleep 2
            done
          done

      - name: Teste de fumaça
        run: SITE=http://localhost:3002 ASSINANTE=http://localhost:3001 GESTAO=http://localhost:3000 node scripts/smoke.mjs

      - name: Rotina diária pelo script do agendador
        run: URL_GESTAO=http://localhost:3000 bash scripts/rodar-rotina.sh

      - name: CSP imposta nas telas principais
        run: node scripts/e2e/csp.mjs

      - name: Fluxo de assinatura (chave D8 desligada, como na entrega atual)
        run: node scripts/e2e/assinatura.mjs

      - name: Fluxo de pagamento (D8 + provedor simulado)
        # O simulador só liga fora de produção: o assinante sobe em modo de desenvolvimento.
        env:
          DATABASE_URL: postgresql://app_servidor:senha-do-app-servidor-so-para-ci-123456@localhost:5432/ovo_teste
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/ovo_teste
          BETTER_AUTH_URL: http://localhost:3001
          PAGAMENTO_PROVEDOR: simulado
          E2E_SEGREDO: segredo-simulado-so-para-o-ci-0123456789
        run: |
          pkill -f "next-server" || true
          sleep 2
          (cd apps/assinante && nohup pnpm dev > "$RUNNER_TEMP/assinante-dev.log" 2>&1 &)
          (cd apps/site && nohup pnpm start > "$RUNNER_TEMP/site2.log" 2>&1 &)
          for url in http://localhost:3001/api/saude http://localhost:3002/api/saude; do
            for i in $(seq 1 60); do curl -fsS "$url" > /dev/null 2>&1 && break; [ "$i" = 60 ] && exit 1; sleep 2; done
          done
          node scripts/e2e/pagamento.mjs

      - name: Evidências em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-falha
          path: |
            e2e-falha.png
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore
